name: Daily PAK'nSAVE scrape

on:
  schedule:
    # GitHub cron runs in UTC. 21:00 UTC = 9:00am NZST (winter).
    # During NZ daylight saving this lands at 10:00am; use "0 20 * * *" in summer for 9am.
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Check files are in the right place
        run: |
          ls -la
          if [ ! -f paknsave_pipeline.py ]; then
            echo "::error::paknsave_pipeline.py is not at the top level of the repo. Move it out of any subfolder."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "playwright>=1.45"
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Check if PAK'nSAVE blocks this server
        continue-on-error: true
        run: |
          echo "Runner location:"; curl -s https://ipinfo.io/json || true
          echo; echo "PAK'nSAVE response:"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" https://www.paknsave.co.nz/shop/category/fruit-and-vegetables

      - name: Run scraper
        run: xvfb-run -a python paknsave_pipeline.py

      - name: Upload debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: |
            debug_screenshot.png
            debug_page.html
          if-no-files-found: ignore

      - name: Commit updated site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html paknsave_products.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily scrape $(date -u +'%Y-%m-%d')"
            git push
          fi
